name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installation
        run: pip install -e ".[pipeline,dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (pipeline dbt, modèle, garde-fous, agent, API)
        run: pytest -q
        env:
          IMMO_RAG_DENSE: "false"

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image
        run: docker build -t immo-ai-platform .
