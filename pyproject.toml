[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "immo-ai-platform"
version = "0.1.0"
description = "Assistant IA sur le marché immobilier d'Île-de-France : lakehouse DVF, modèle de prix LightGBM et agent LangGraph."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yani Zekhnine" }]
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "lightgbm>=4.3",
  "requests>=2.31",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langgraph>=1.0",
  "rank-bm25>=0.2.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
pipeline = ["dbt-core>=1.10", "dbt-duckdb>=1.9", "mlflow>=3.0"]
llm = ["langchain-groq>=1.0", "langchain-anthropic>=1.0", "langchain-openai>=1.0"]
rag = ["fastembed>=0.4"]
app = ["streamlit>=1.35", "plotly>=5.20"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
immo = "immo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
immo = ["evaluation/*.json"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["dbt/target", "dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
